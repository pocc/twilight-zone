name = "twilight-zone"
main = "src/worker/index.ts"
# Keep current. Bump at minimum once per release; see
# https://developers.cloudflare.com/workers/configuration/compatibility-dates/
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
# Account ID is read from the CLOUDFLARE_ACCOUNT_ID environment variable.
# Remove this line prior to release

# Built React SPA — served via the ASSETS binding.
assets = { directory = "dist", not_found_handling = "single-page-application" }

# Surfaces worker logs and tail events in the dashboard.
[observability]
enabled = true

# Hourly spec-drift monitor (src/worker/spec-monitor.ts). Every hour on the
# hour, a scheduled() handler HEADs the live Cloudflare OpenAPI spec for its
# ETag; only when the ETag has changed does it download + parse `.paths` and
# diff the write-endpoint set against the committed baseline
# (src/openapi-baseline.generated.json). If new endpoints appear it raises an
# in-app banner and sends a gchat message. The ETag short-circuit means the vast
# majority of hourly runs do zero parsing — just a cheap conditional HEAD.
[triggers]
crons = ["0 * * * *"]

# Migration PII-stripped run logging. See src/migrate/run-log.ts and
# docs/SECURITY.md § "Data collection (migration run logging)".
[[kv_namespaces]]
binding = "RUN_LOG"
