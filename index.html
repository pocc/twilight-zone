<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twilight Zone - Cloudflare Zone Migration</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Metamorphous&display=swap">

</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <script id="tz-theme-prepaint">
    (() => {
      try {
        const theme = localStorage.getItem('tz_theme');
        const twilight = localStorage.getItem('tz_twilightTheme') === 'on';
        if (twilight) {
          document.body.classList.add('twilight-theme');
        } else if (theme === 'light') {
          document.body.classList.add('light-theme');
        }
      } catch {
        // Storage can be unavailable in private / locked-down contexts; dark is the safe default.
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/app/main.tsx"></script>
</body>
</html>
