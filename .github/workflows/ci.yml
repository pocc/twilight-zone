name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build:
    name: Build (verify Vite + Worker bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

  coverage:
    name: Cloudflare API Coverage Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs (in order):
      #   1. generate:sdk-index — parses node_modules/cloudflare/resources/**
      #      to produce coverage/sdk-index.generated.json. Determined entirely
      #      by the installed cloudflare package version.
      #   2. generate:tz-coverage — parses src/api.ts + src/migrate/**.ts to
      #      produce coverage/tz-coverage.generated.json. Determined entirely
      #      by the current source tree.
      #   3. coverage-report --check — gates on four invariants:
      #        a. real in-SDK gaps    ≤ ratchet (max_in_scope_gaps_in_sdk)
      #        b. all real gaps      ≤ ratchet (max_in_scope_gaps)
      #        c. zero stale overrides (entries in scripts/coverage-overrides
      #           .json that don't match any current OpenAPI endpoint)
      #        d. zero uncategorized endpoints (paths the feature taxonomy
      #           doesn't classify — usually new Cloudflare product lines
      #           that need an entry added)
      #
      # The OpenAPI writes manifest (src/openapi-writes.generated.json) is
      # CHECKED IN, regenerated by `npm run generate:openapi-manifest`
      # locally when the OpenAPI spec changes upstream. CI does not need
      # to fetch the spec.
      - name: Coverage check (gates + invariants)
        run: npm run coverage:check
